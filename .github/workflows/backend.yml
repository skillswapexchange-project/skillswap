name: Backend checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEBUG: "true"
      PYTHONPATH: backend/fastapi_backend:.
      TEST_DB_ENGINE: sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python backend/django_backend/manage.py check
      - run: python backend/django_backend/manage.py makemigrations --check --dry-run
      - run: python backend/django_backend/manage.py test users skills exchanges reviews backend.fastapi_backend.tests
