name: Project checks

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    env:
      DEBUG: "true"
      PYTHONPATH: backend/fastapi_backend:.
      TEST_DB_ENGINE: sqlite3
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python backend/django_backend/manage.py check
      - run: python backend/django_backend/manage.py makemigrations --check --dry-run
      - run: python backend/django_backend/manage.py test users skills exchanges reviews backend.fastapi_backend.tests

  test-postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: skillswap-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DEBUG: "true"
      PYTHONPATH: backend/fastapi_backend:.
      DB_NAME: postgres
      DB_USER: postgres
      DB_PASSWORD: skillswap-test-password
      DB_HOST: 127.0.0.1
      DB_PORT: "5432"
      DB_SSLMODE: disable
      DB_CONN_MAX_AGE: "0"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements.txt
      - run: python -m pip install -r requirements.txt
      - run: python backend/django_backend/manage.py check
      - run: python backend/django_backend/manage.py makemigrations --check --dry-run
      - run: python backend/django_backend/manage.py test users skills exchanges reviews backend.fastapi_backend.tests --keepdb

  test-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --prefix frontend
      - run: npm --prefix frontend test
      - run: npm --prefix frontend run build
